<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0c" />
  <title>Contraction Timer</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>Contraction Timer</h1>
      <button id="clearBtn" class="icon-btn" title="Clear all history">Clear</button>
    </header>

    <section class="stats-card" aria-label="Stats for the past hour">
      <h2 class="stats-title">Past hour</h2>
      <div class="stats-row">
        <div class="stat">
          <div class="stat-value" id="statAvgDuration">–</div>
          <div class="stat-label">avg. duration</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="statCount">0</div>
          <div class="stat-label">contractions</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="statAvgInterval">–</div>
          <div class="stat-label">avg. interval</div>
        </div>
      </div>
    </section>

    <section class="timer-card" aria-label="Timer">
      <div class="timer-display" id="timerDisplay">0:00</div>
      <div class="timer-sub" id="timerSub">Ready</div>
      <button id="timerBtn" class="timer-btn">
        <span class="icon">▶</span>
        <span class="label">Start Contraction</span>
      </button>
    </section>

    <section class="history-card" aria-label="History">
      <div class="history-header">
        <h2>History</h2>
        <div class="range-tabs" role="tablist" aria-label="History range">
          <button class="range-tab active" data-hours="1">1h</button>
          <button class="range-tab" data-hours="3">3h</button>
          <button class="range-tab" data-hours="6">6h</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Time</th>
              <th>Interval</th>
              <th>Duration</th>
              <th>Intensity</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="historyBody">
            <!-- rows injected here -->
          </tbody>
        </table>
        <p id="emptyState" class="empty-state">No contractions recorded yet.</p>
      </div>
    </section>

    <footer class="app-footer">
      <p>Data is stored only on this device (browser local storage).</p>
    </footer>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
